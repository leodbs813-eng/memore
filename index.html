Index <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메모RE">
<title>메모RE</title>
<link rel="icon" href="IMG_6116.PNG" type="image/png">
<link rel="apple-touch-icon" href="IMG_6116.PNG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js" defer></script>
<script>
  try { var t = localStorage.getItem('memore_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#27272b; --sub:rgba(39,39,43,.46); --faint:rgba(39,39,43,.06); --line:rgba(39,39,43,.12);
  --good:#4c9a6a; --bad:#de6a52;
  --MEMORIZE:#e3a04a; --SEQUENCE:#5b8fd0; --CLASSIFY:#a67bc6;
  --shadow:0 1px 2px rgba(40,30,15,.05), 0 10px 28px -16px rgba(40,30,15,.28);
  --lift:0 2px 4px rgba(40,30,15,.06), 0 22px 40px -18px rgba(40,30,15,.4);
  --ease:cubic-bezier(.2,.85,.25,1); --spring:cubic-bezier(.34,1.5,.6,1);
  color-scheme:light;
}
:root[data-theme=white]{ --bg:#fbfbfa; }
:root[data-theme=ivory]{
  --bg:#f3eee3; --surface:#fcf9f2; --ink:#2d2a26; --sub:rgba(45,42,38,.48); --faint:rgba(90,65,30,.07); --line:rgba(90,65,30,.14);
}
:root[data-theme=dark]{
  --bg:#151515; --surface:#212121; --ink:#ecebe6; --sub:rgba(236,235,230,.45); --faint:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --good:#6cc08a; --bad:#ef7d65;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.7);
  --lift:0 2px 4px rgba(0,0,0,.4), 0 24px 44px -18px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--ink)}
body{
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-weight:400;letter-spacing:-.005em;
  background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;transition:background-color .3s;
}
input,textarea,[contenteditable]{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
svg{display:block}
.i{width:22px;height:22px;flex:none}
[hidden]{display:none!important}

/* ---------- bar ---------- */
#bar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;
  max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:linear-gradient(var(--bg) 72%,transparent);
}
#bar .b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .35s var(--spring),background .2s}
#bar .b:active{transform:scale(.86);background:var(--faint)}
.sp{flex:1}
#prog{flex:1;height:5px;margin:0 10px;border-radius:5px;background:var(--faint);overflow:hidden}
#prog.round{animation:pop .5s var(--spring)}
#prog i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ink);transition:width .6s var(--ease)}
#left{min-width:34px;padding-right:8px;text-align:right;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
#theme i{width:18px;height:18px;border-radius:50% 46% 52% 48%;background:var(--next,#151515);box-shadow:inset 0 0 0 1.5px var(--line)}

/* ---------- stage & views ---------- */
#stage{position:relative;max-width:600px;margin:0 auto;padding:4px 18px calc(env(safe-area-inset-bottom) + 130px)}
.view{animation:vin .46s var(--ease) backwards}
.view.leaving{position:fixed;z-index:0;pointer-events:none;animation:vout .26s ease forwards}
@keyframes vin{from{opacity:0;transform:translate(calc(var(--dir,0) * 38px),calc((1 - var(--dir,0) * var(--dir,0)) * 12px))}}
@keyframes vout{to{opacity:0;transform:translateX(calc(var(--dir,0) * -26px)) scale(.985)}}

.title{
  display:block;font-size:29px;line-height:1.3;font-weight:300;letter-spacing:-.02em;
  padding:10px 2px 20px;outline:none;word-break:keep-all;overflow-wrap:anywhere;cursor:text;
  text-decoration:underline wavy transparent 1.5px;text-underline-offset:7px;transition:text-decoration-color .3s;
}
.title:focus{text-decoration-color:var(--sub)}
.head{display:flex;align-items:flex-start;gap:12px}
.head .title{flex:1;min-width:0}
.medal{display:flex;align-items:center;gap:4px;padding-top:20px;color:var(--sub);font-size:15px;font-variant-numeric:tabular-nums}
.medal .i{width:18px;height:18px}
.medal b{font-weight:400}

/* ---------- lists ---------- */
.list{list-style:none;display:flex;flex-direction:column;gap:10px}
.row{position:relative;border-radius:var(--rr,22px);touch-action:pan-y}
.del{
  position:absolute;inset:0;border-radius:inherit;background:var(--bad);color:#fff;
  display:flex;align-items:center;justify-content:flex-end;padding-right:22px;opacity:var(--p,0);
}
.del .i{transform:scale(calc(.5 + var(--p,0) * .5))}
.row-in{
  position:relative;display:flex;align-items:center;gap:14px;min-height:66px;padding:14px 20px;
  background:var(--surface);border-radius:inherit;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .35s var(--ease),box-shadow .3s;
}
.row:active .row-in{transform:scale(.985)}
.dot{width:12px;height:12px;flex:none;border-radius:50% 44% 56% 48%;background:var(--c)}
.name{flex:1;min-width:0;font-size:17px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.meta span{display:flex;align-items:center;gap:3px}
.meta .i{width:15px;height:15px}
.sorting>[data-i]{transition:transform .26s var(--ease)}
.lifted{position:relative;z-index:6}
.sorting>.lifted{transition:none}
.lifted .row-in,.lifted .in,.seq .lifted{box-shadow:var(--lift)}
.list-empty{height:140px}

/* ---------- orb (the one primary control) ---------- */
#orb{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:40;
  width:64px;height:64px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);border-radius:50%;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:pointer;
  transition:width .5s var(--spring),height .5s var(--spring),border-radius .5s var(--ease),transform .5s var(--spring),opacity .3s,background .3s;
  animation:blob 9s ease-in-out infinite;
}
@keyframes blob{
  0%,100%{border-radius:50% 46% 53% 47%/47% 53% 46% 52%}
  33%{border-radius:45% 55% 48% 52%/55% 45% 52% 48%}
  66%{border-radius:54% 46% 44% 56%/46% 54% 50% 50%}
}
#orb[data-kind=hidden]{transform:translateX(-50%) scale(0);opacity:0;pointer-events:none}
#orb[data-kind=handle]{width:92px;height:40px;border-radius:22px;animation:none;background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
#orb[data-kind=check],#orb[data-kind=next]{width:72px;height:72px}
#orb.open{width:min(calc(100vw - 32px),460px);border-radius:32px;animation:none}
#orb.pulse{animation:blob 9s ease-in-out infinite,breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--ink) 10%,transparent),0 14px 30px -12px rgba(0,0,0,.5)}}
#orb .ob{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .2s}
#orb .ob .i{width:26px;height:26px}
#orb input{
  position:absolute;inset:0;width:100%;padding:0 28px;background:none;border:0;outline:0;
  color:var(--bg);font-size:18px;opacity:0;pointer-events:none;
}
#orb input::placeholder{color:var(--bg);opacity:.4}
#orb.open input{opacity:1;pointer-events:auto;transition:opacity .2s .18s}
#orb.open .ob{opacity:0}

/* ---------- set hub ---------- */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,5vw,26px);margin:18px 6px 40px}
.mode{
  position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--ink);
  animation:blob 12s ease-in-out infinite;animation-delay:var(--dl,0s);
  transition:transform .4s var(--spring),opacity .3s;touch-action:pan-y;
}
.mode:active{transform:scale(.93)}
.mode.empty{opacity:.42}
.mode .mi{color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.mode .mi .i{width:30px;height:30px}
.mode .n{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.ring{transition:opacity .4s}
.ring .arc{stroke:var(--c);stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,0) * 100);transition:stroke-dashoffset .7s var(--ease)}
.mode.pressing .arc{stroke-dashoffset:100;transition:stroke-dashoffset .62s linear .14s}
.mode:nth-child(2){margin-top:26px}

.diff{
  position:relative;display:grid;grid-template-columns:repeat(3,1fr);width:216px;height:50px;margin:0 auto;padding:5px;
  border-radius:25px;background:var(--faint);touch-action:pan-y;
}
.diff .knob{
  position:absolute;top:5px;left:5px;width:calc((100% - 10px) / 3);height:40px;border-radius:20px;
  background:var(--surface);box-shadow:var(--shadow);transform:translateX(calc(var(--k,0) * 100%));transition:transform .45s var(--spring);
}
.diff.drag .knob{transition:none}
.diff button{position:relative;z-index:1;font-size:15px;font-weight:400;color:var(--sub);transition:color .3s}
.diff button.on{color:var(--ink)}

/* ---------- cards ---------- */
.deck{position:relative;height:min(56vh,440px);height:min(56dvh,440px);max-width:430px;margin:14px auto 0}
.deck.typing{height:min(40vh,330px);height:min(40dvh,330px)}
.card{position:absolute;inset:0;touch-action:none;cursor:grab;will-change:transform}
.card:active{cursor:grabbing}
.card.ghost{pointer-events:none;border-radius:30px;background:var(--surface);box-shadow:var(--shadow);transform:translateY(16px) scale(.93);opacity:.5;transition:transform .32s var(--ease),opacity .32s}
.deck.adv .ghost{transform:none;opacity:1}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--spring)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px 26px;text-align:center;
  background:var(--surface);border-radius:30px 34px 28px 32px/32px 28px 34px 30px;box-shadow:var(--shadow);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;
}
.face.back{transform:rotateY(180deg)}
.face p{font-size:var(--fs,28px);line-height:1.4;font-weight:300;letter-spacing:-.015em;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap;max-height:100%;overflow:auto}
.card::after{
  content:'';position:absolute;inset:-3px;border-radius:32px;pointer-events:none;
  box-shadow:0 0 0 3px var(--gc,var(--good));opacity:var(--ga,0);transition:opacity .2s;
}
.card.good{--gc:var(--good);--ga:1}
.card.bad{--gc:var(--bad);--ga:1}
.stamp{position:absolute;top:22px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;opacity:0;pointer-events:none;color:#fff}
.stamp .i{width:24px;height:24px}
.stamp.g{left:22px;background:var(--good)}
.stamp.b{right:22px;background:var(--bad)}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-9px}40%{translate:8px}60%{translate:-5px}80%{translate:3px}}
@keyframes pop{40%{scale:1.14}}

.answer{display:block;width:100%;max-width:430px;height:58px;margin:26px auto 0;padding:0 24px;border-radius:29px;
  border:1.5px solid var(--line);background:var(--surface);outline:none;font-size:19px;text-align:center;transition:border-color .25s,box-shadow .25s}
.answer:focus{border-color:var(--ink)}
.answer.good{border-color:var(--good)}
.answer.bad{border-color:var(--bad)}

/* ---------- sequence ---------- */
.seq{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:10px}
.seq li{
  display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;min-height:58px;
  background:var(--surface);border-radius:18px 21px 17px 20px;box-shadow:var(--shadow);
  touch-action:pan-y;cursor:grab;transition:background-color .35s,opacity .35s,box-shadow .3s;
}
.seq .num{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--faint);color:var(--sub);transition:background .3s,color .3s}
.seq .tx{flex:1;font-size:16px;font-weight:400;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
.seq .ds{display:block;margin-top:2px;font-size:13px;font-weight:300;color:var(--sub)}
.seq li.locked{opacity:.5;cursor:default}
.seq li.locked .num,.seq li.good .num{background:var(--good);color:#fff}
.seq li.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.seq li.bad .num{background:var(--bad);color:#fff}
.seq.checked li{cursor:default}

/* ---------- classify ---------- */
.cstage{position:relative;z-index:5;height:min(36vh,290px);height:min(36dvh,290px);max-width:380px;margin:12px auto 0}
.buckets{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:30px auto 0;max-width:520px}
.bucket{
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:112px;max-width:46%;padding:20px 24px 16px;
  background:color-mix(in srgb,var(--c) 20%,var(--surface));border-radius:26px 30px 24px 28px/30px 24px 28px 26px;
  transition:transform .4s var(--spring),box-shadow .3s;
}
.bucket .bl{font-size:17px;font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bucket .bn{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.bucket.over{transform:scale(1.12)}
.bucket.hit{animation:pop .5s var(--spring)}
.bucket.hint{box-shadow:0 0 0 3px var(--good)}
.bucket.miss{box-shadow:0 0 0 3px var(--bad)}

/* ---------- done ---------- */
.done{min-height:62vh;min-height:62dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;animation:vin .5s var(--ease) backwards}
.done .big{width:180px;height:180px}
.done .big circle{fill:none;stroke-width:6;stroke-linecap:round}
.done .trk{stroke:var(--faint)}
.done .acc{stroke:var(--good);stroke-dasharray:100;transform:rotate(-90deg);transform-origin:60px 60px;animation:arc 1.1s var(--ease) .15s backwards}
@keyframes arc{from{stroke-dashoffset:100}}
.done .ck{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .55s var(--ease) .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done .medal{padding:0;font-size:22px}
.done .medal .i{width:22px;height:22px}
.done .medal b{font-weight:400;display:inline-block}
.done .medal b.bump{animation:pop .5s var(--spring)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,8,5,.3);opacity:0;transition:opacity .35s}
.scrim.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:620px;margin:0 auto;max-height:92vh;max-height:92dvh;
  display:flex;flex-direction:column;background:var(--bg);border-radius:32px 32px 0 0;
  box-shadow:0 -14px 50px -14px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(105%);transition:transform .5s var(--ease);
}
.sheet.on{transform:translateY(var(--sy,0px))}
.sheet.drag{transition:none}
.sheet.tall{height:90vh;height:90dvh}
.sheet .top{padding:10px 18px 4px;touch-action:none;flex:none}
.grip{width:44px;height:5px;margin:0 auto 8px;border-radius:3px;background:var(--line)}
.sheet .body{flex:1;overflow:auto;overscroll-behavior:contain;padding:8px 16px 40px;-webkit-overflow-scrolling:touch}

.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:52px}
.tabs button{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums;transition:color .3s}
.tabs button.on{color:var(--ink)}
.tabs button.on .i{color:var(--c)}
.tabs .ind{position:absolute;left:0;bottom:2px;width:calc(100% / 3);display:flex;justify-content:center;pointer-events:none;transform:translateX(calc(var(--t,0) * 100%));transition:transform .5s var(--spring)}
.tabs .ind::after{content:'';width:28px;height:4px;border-radius:2px;background:var(--c,var(--ink));transition:background .3s}

.erows{list-style:none;display:flex;flex-direction:column;gap:8px}
.erow{position:relative;border-radius:18px;touch-action:pan-y}
.erow .in{position:relative;display:flex;align-items:flex-start;gap:8px;padding:8px 10px 8px 8px;background:var(--surface);border-radius:inherit;box-shadow:var(--shadow)}
.erow.ghost .in{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.hd{flex:none;width:30px;height:30px;margin-top:5px;border-radius:50%;display:grid;place-items:center;background:var(--faint);color:var(--sub);font-size:12px;touch-action:none;cursor:grab;font-variant-numeric:tabular-nums}
.hd .i{width:16px;height:16px}
.fs{flex:1;min-width:0;display:flex;flex-direction:column}
.fr{display:flex;min-width:0}
.fr>input{flex:1;min-width:0}
.fr>input+input{background-image:linear-gradient(var(--line),var(--line));background-size:1.5px 55%;background-position:left center;background-repeat:no-repeat;padding-left:12px}
.fs input{width:100%;padding:9px 8px;border:0;outline:0;background-color:transparent;font-size:16px;border-radius:10px;transition:background .2s}
.fs input:focus{background-color:var(--faint)}
.fs input::placeholder{color:var(--sub);opacity:.55}
.fs input.d{padding-top:2px;font-size:14px;color:var(--sub)}
.fs input.g{flex:.7;color:color-mix(in srgb,var(--c,var(--ink)) 70%,var(--ink))}

.xctx{display:flex;align-items:center;justify-content:center;gap:8px;padding:2px 0 16px;color:var(--sub);font-size:15px}
.xctx .i{width:18px;height:18px}
.xctx .dot{width:11px;height:11px}
.xf{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;padding:0 4px 12px}
.xout{
  width:104px;height:104px;display:grid;place-items:center;background:var(--ink);color:var(--bg);
  animation:blob 10s ease-in-out infinite;transition:transform .35s var(--spring),background .3s;
}
.xout .i{width:30px;height:30px}
.xout:active{transform:scale(.9)}
.xout.ok{background:var(--good);color:#fff}
.xin{position:relative;height:132px;border-radius:26px 30px 24px 28px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .3s}
.xin textarea{position:absolute;inset:0;width:100%;height:100%;padding:16px;border:0;outline:0;background:none;resize:none;border-radius:inherit;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sub);word-break:break-all}
.xin .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);pointer-events:none;transition:opacity .2s}
.xin .ph .i{width:30px;height:30px}
.xin.has .ph{opacity:0}
.xin:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.xin.ok{box-shadow:inset 0 0 0 2px var(--good)}
.xin.err{box-shadow:inset 0 0 0 2px var(--bad);animation:shake .45s}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:60;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  position:relative;display:flex;align-items:center;gap:10px;max-width:78vw;padding:11px 18px 11px 14px;overflow:hidden;
  border-radius:24px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--lift);pointer-events:auto;
  animation:tin .45s var(--spring) backwards;transition:opacity .3s,transform .3s;
}
.toast s,.toast span{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =========================================================
   card editor (bottom sheet)

let lastTab = 'MEMORIZE';
const SPEC = {

  SEQUENCE: { f: ['text', 'desc'], ph: ['항목', '설명'] },

}

    const li = h('li.erow' + (item ? '' : '.ghost'), null, h('div.del', null, ico('x')), h('div.in', null, h('span.hd', null, item ? String(i + 1) : ico('plus')), fs));
    if (item) li.dataset.i = i;
    return li;
  }
  function draw(focus) {
    list.replaceChildren(...arr().map((c, i) => row(c, i)), row(null));
    if (mode === 'CLASSIFY') dl.replaceChildren(...[...new Set(arr().map(c => c.group).filter(Boolean))].map(g => h('option', { value: g })));
    updCounts();
    if (focus) {

      if (inp) inp.focus();

    toast({ text: str(o[SPEC[mode].f[0]]) || '·', strike: true, action: () => {
      target.splice(Math.min(i, target.length), 0, o); saveSoon();

    const li = e.target.closest && e.target.closest('.erow');
    if (!li || li.classList.contains('ghost')) return;
    setTimeout(() => {
      if (!li.isConnected || li.contains(document.activeElement) || list.classList.contains('sorting')) return;
      const i = +li.dataset.i, o = arr()[i];
      if (!o || !isBlank(o, mode)) return;
      arr().splice(i, 1); saveSoon();
      const a = document.activeElement, ar = a && a.closest && a.closest('.erow');
      let focus = null;
      if (ar && list.contains(ar)) focus = { i: ar.classList.contains('ghost') ? null : (+ar.dataset.i > i ? +ar.dataset.i - 1 : +ar.dataset.i), f: a.dataset.f };

  });
  list.addEventListener('paste', e => {

  let g = null;

    flushSave();
    MODES.forEach(m => { if (JSON.stringify(set.cards[m]) !== snap[m]) dropSessions(set.id, m); });

}

/* =========================================================
   transfer sheet: one copy shape, one paste zone — context decides scope
   ========================================================= */
function openXfer() {
  if (overlays.length) return;
  let label, badge, code;
  if (route.v === 'folder') {
    const f = folderOf(route.id);
    label = f.name; badge = h('i.dot', { style: `--c:${colorOf(f.id)}` });
    code = () => compress({ name: f.name, sets: f.sets.map(s => ({ name: s.name, count: s.count, cards: s.cards })) });
  } else if (route.v === 'set') {
    const [s] = setOf(route.id);
    label = s.name; badge = ico('MEMORIZE');
    code = () => compress({ type: 'MEMORE_SET_BUNDLE', version: 1, set: { name: s.name, cards: s.cards } });
  } else {
    label = ''; badge = ico('stack');
    code = () => compress(data);
  }
  const out = h('button.xout', { 'aria-label': 'copy' }, ico('out'));
  const ta = h('textarea', { spellcheck: false, autocomplete: 'off', autocapitalize: 'off', 'aria-label': 'paste' });
  const zone = h('div.xin', null, h('span.ph', null, ico('in')), ta);
  const { close } = openSheet({ body: [h('div.xctx', null, badge, label ? h('span', { text: label }) : null), h('div.xf', null, out, zone)] });
  let resetT = 0;
  out.addEventListener('click', async () => {
    const c = code();
    const ok = await copyText(c);
    out.classList.add('ok'); out.replaceChildren(ico(ok ? 'check' : 'x')); buzz(8);
    if (!ok) { ta.value = c; zone.classList.add('has'); ta.focus(); ta.select(); }
    clearTimeout(resetT);
    resetT = setTimeout(() => { out.classList.remove('ok'); out.replaceChildren(ico('out')); }, 1500);
  });
  let tm = 0;
  const attempt = () => {
    const v = ta.value.trim();
    zone.classList.toggle('has', !!v);
    zone.classList.remove('err', 'ok');
    if (!v) return;
    if (applyCode(v)) { zone.classList.add('ok'); buzz(10); setTimeout(close, 380); }

  ta.addEventListener('paste', () => setTimeout(attempt, 0));

    zone.classList.toggle('has', !!ta.value.trim());

    clearTimeout(tm); tm = setTimeout(attempt, 900);
  });
}

function applyCode(raw) {
  const p = decompress(raw);
  if (!p) return false;
  const after = () => setTimeout(() => { if (!overlays.length) show(parse(hashOf(route)), 0); }, 420);
  const full = asFullBackup(p);
  if (full) {
    const nd = sanitizeData(full);
    if (!nd || !nd.folders.length) return false;
    const prev = JSON.stringify(data);
    data = nd; save(); after();
    toast({ ms: 9000, action: () => { data = sanitizeData(JSON.parse(prev)); save(); after(); } });
    return true;
  }
  const sets = extractSets(p).map(s => sanitizeSet(s)).filter(Boolean);
  if (!sets.length) return false;
  let folder = route.v === 'folder' ? folderOf(route.id) : route.v === 'set' ? setOf(route.id)[1] : null;
  let created = null;
  if (!folder) {
    const nm = Array.isArray(p.sets) && p.name ? str(p.name).trim() : '';

/* =========================================================
   study: shared pieces
   ========================================================= */
function cardEl() {

  const sg = h('i.stamp.g', null, ico('ring')), sb = h('i.stamp.b', null, ico('x'));
  const card = h('div.card', null, flip, sg, sb);
  let flipped = false;
  return {
    card,
    get flipped() { return flipped; },
    setFlip(v, instant) {
      flipped = v;
      if (instant) flip.style.transition = 'none';
      card.classList.toggle('flipped', v);
      if (instant) { void flip.offsetWidth; flip.style.transition = ''; }
    },
    setText(q, a) { pF.textContent = q; pB.textContent = a; fit(pF, q); fit(pB, a); },
    tint(g) {
      sg.style.opacity = Math.max(0, g); sb.style.opacity = Math.max(0, -g);
      if (!g) { card.style.removeProperty('--ga'); card.style.removeProperty('--gc'); return; }
      card.style.setProperty('--ga', (Math.abs(g) * .9).toFixed(3));
      card.style.setProperty('--gc', g > 0 ? 'var(--good)' : 'var(--bad)');
    },

    reset() {

}
function enter(el) {
  el.animate([{ opacity: 0, transform: 'translateY(22px) scale(.93)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,.85,.25,1)' });
}
function poolSession(key, src, valid) {
  let S = sessions[key];
  const ok = S && typeof S === 'object' && Array.isArray(S.currentPool) && S.currentPool.every(valid)
    && (!S.unlearned || (Array.isArray(S.unlearned) && S.unlearned.every(valid)))
    && Number.isInteger(S.currentIndex) && S.currentIndex >= 0 && S.currentIndex <= S.currentPool.length
    && S.currentPool.length - S.currentIndex + (S.unlearned || []).length > 0;
  if (!ok) S = { currentPool: shuffle(src), unlearned: [], currentIndex: 0, total: src.length, miss: [], round: 1 };
  S.unlearned = S.unlearned || [];
  S.miss = Array.isArray(S.miss) ? S.miss : [];
  S.total = S.total || src.length;
  S.round = S.round || 1;
  if (S.currentIndex >= S.currentPool.length) { S.currentPool = shuffle(S.unlearned); S.unlearned = []; S.currentIndex = 0; S.round++; }
  sessions[key] = S; saveSess();
  return S;
}
const poolLeft = S => S.currentPool.length - S.currentIndex + S.unlearned.length;
function poolAdvance(S, known, keyOf) {
  const c = S.currentPool[S.currentIndex];
  if (!known) { S.unlearned.push(c); const k = keyOf(c); if (!S.miss.includes(k)) S.miss.push(k); }
  S.currentIndex++;
  if (S.currentIndex < S.currentPool.length) return true;
  if (!S.unlearned.length) return false;
  S.currentPool = shuffle(S.unlearned); S.unlearned = []; S.currentIndex = 0; S.round++;
  return 'round';
}
function poolProgress(S) { const left = poolLeft(S); setProg((S.total - left) / S.total, left); }

function complete(set, key, acc, view) {
  set.count = (set.count || 0) + 1; save();
  delete sessions[key]; saveSess();
  if (cur !== view) return;
  if (document.activeElement && view.el.contains(document.activeElement)) document.activeElement.blur();
  setOrb(null); setProg(1, '');
  const n = set.count;
  const off = (100 - clamp(acc, 0, 1) * 100).toFixed(1);
  const box = h('div.done', { html: `<svg class="big" viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="acc" cx="60" cy="60" r="52" pathLength="100" style="stroke-dashoffset:${off}"/><path class="ck" d="M41 62l13 13 26-28" pathLength="60"/></svg>` });
  const cnt = h('b', { text: String(n - 1) });
  box.append(h('div.medal', null, ico('medal'), cnt));

  setTimeout(() => { cnt.textContent = String(n); kick(cnt, 'bump'); buzz(14); }, 1050);

VIEWS.study = r => {
  const [set] = setOf(r.id);

/* ---------- 1. memorize: swipe right = know, left = again, tap = flip ---------- */
function studyMemorize(set) {
  const src = set.cards.MEMORIZE.filter(c => str(c.front).trim() || str(c.back).trim());
  if (!src.length) return null;
  const D = diff, key = sk(set.id, 'MEMORIZE', D);
  const S = poolSession(key, src, c => c && typeof c === 'object' && ('front' in c || 'back' in c));
  const rev = D === 'RE', typing = D !== 'ME';
  const q = c => str(rev ? c.back : c.front), a = c => str(rev ? c.front : c.back);
  const keyOf = c => JSON.stringify([c.front, c.back]);
  const C = cardEl();
  const deck = h('div.deck' + (typing ? '.typing' : ''), null, h('div.card.ghost'), C.card);
  const inp = typing ? h('input.answer', { enterKeyHint: 'done', autocomplete: 'off', autocapitalize: 'off', spellcheck: false, 'aria-label': 'answer' }) : null;
  const el = h('section', null, deck, inp);
  let busy = false, pending = null, ty = 0, alive = true;

  function paint(anim = true) {
    const c = S.currentPool[S.currentIndex];
    C.reset(); C.setFlip(false, true); C.setText(q(c), a(c));
    deck.classList.remove('adv');
    if (anim) enter(C.card);
    busy = false; pending = null; ty = 0;
    if (inp) { inp.value = ''; inp.classList.remove('good', 'bad'); if (finePointer) inp.focus({ preventScroll: true }); }
    poolProgress(S);
  }
  function fly(dir, known) {
    if (busy) return;
    busy = true;
    C.tint(dir);
    C.card.style.transition = 'transform .36s cubic-bezier(.3,.5,.4,1), opacity .36s ease-in';
    C.card.style.transform = `translate(${dir * (innerWidth * .5 + 320)}px, ${ty + 40}px) rotate(${dir * 26}deg)`;
    C.card.style.opacity = '0';
    deck.classList.add('adv');
    buzz(6);
    setTimeout(() => {
      const res = poolAdvance(S, known, keyOf);
      if (res === false) return complete(set, key, 1 - S.miss.length / S.total, view);
      saveSess();
      if (!alive) return;
      if (res === 'round') kick($('#prog'), 'round');
      paint();
    }, 260);
  }
  function reveal(ok) {
    C.setFlip(true); C.mark(ok ? 'good' : 'bad');
    if (inp) inp.classList.add(ok ? 'good' : 'bad');
    if (ok) { pending = 'right'; buzz(8); setTimeout(() => { if (alive && pending === 'right') fly(1, true); }, 700); }
    else { pending = 'wrong'; kick(deck, 'shake'); buzz([10, 40, 10]); }
  }
  function tapCard() {
    if (busy || pending === 'right') return;
    if (pending === 'wrong') return fly(-1, false);
    if (typing) return reveal(false);
    C.setFlip(!C.flipped);
  }
  if (inp) inp.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    if (busy || pending === 'right') return;
    if (pending === 'wrong') return fly(-1, false);
    reveal(matches(inp.value, a(S.currentPool[S.currentIndex])));
  });
  press(C.card, {
    decide: () => (busy || pending === 'right' ? 'none' : 'drag'),
    start: () => { C.card.style.transition = 'none'; },
    move: s => {
      ty = s.dy * .3;
      C.card.style.transform = `translate(${s.dx}px,${ty}px) rotate(${s.dx * .05}deg)`;
      C.tint(clamp(s.dx / 110, -1, 1));
    },
    end: s => {
      const dir = s.dx > 100 || (s.vx > .5 && s.dx > 30) ? 1 : s.dx < -100 || (s.vx < -.5 && s.dx < -30) ? -1 : 0;
      if (dir) return fly(dir, dir > 0);
      C.card.style.transition = 'transform .55s var(--spring)';
      C.card.style.transform = '';
      C.tint(0);
      if (pending === 'wrong') C.mark('bad');
    },
    tap: tapCard
  });
  const view = {
    el, orb: null,
    key(e) {
      const inInp = e.target === inp, typed = inInp && inp.value;
      if (e.key === 'ArrowRight' && !typed) { e.preventDefault(); fly(1, true); }
      else if (e.key === 'ArrowLeft' && !typed) { e.preventDefault(); fly(-1, false); }
      else if (!inInp && [' ', 'ArrowUp', 'ArrowDown', 'Enter'].includes(e.key)) { e.preventDefault(); tapCard(); }
    },
    mounted: () => paint(false),
    destroy: () => { alive = false; }
  };
  return view;
}

/* ---------- 2. sequence: drag into order, ✓ to check, wrong slots return ---------- */
function studySequence(set) {
  const src = set.cards.SEQUENCE.filter(c => str(c.text).trim() || str(c.desc).trim());
  if (!src.length) return null;
  const D = diff, key = sk(set.id, 'SEQUENCE', D);
  const scramble = base => {
    if (base.length < 2) return base.slice();
    let r, t = 0;
    do { r = shuffle(base); t++; } while (t < 12 && r.every((v, i) => v === base[i]));
    return r;
  };
  let S = sessions[key];
  const n0 = S && Array.isArray(S.master) ? S.master.length : 0;
  const valid = n0 > 0 && Array.isArray(S.order) && Array.isArray(S.locked) && S.order.length === n0 && S.locked.length === n0
    && S.order.every(i => Number.isInteger(i) && i >= 0 && i < n0) && new Set(S.order).size === n0 && S.locked.some(x => !x);
  if (!valid) {
    const master = src.map(x => ({ text: str(x.text), desc: str(x.desc) }));
    S = { master, order: scramble(master.map((_, i) => i)), locked: master.map(() => false), round: 1, checked: false, wrong: [], first: null };
  }
  sessions[key] = S; saveSess();
  const M = S.master, n = M.length;
  const same = (mi, slot) => M[mi].text === M[slot].text && M[mi].desc === M[slot].desc;
  const label = it => (D === 'RE' ? [it.desc || it.text, null] : D === 'MO' ? [it.text || it.desc, null] : [it.text || it.desc, it.text ? it.desc : null]);
  const list = h('ol.seq');
  const el = h('section', null, list);
  let alive = true;

  function progress() { const L = S.locked.filter(Boolean).length; setProg(L / n, n - L); }
  function draw() {
    list.classList.toggle('checked', !!S.checked);
    list.replaceChildren(...S.order.map((mi, slot) => {
      const [t, d] = label(M[mi]);
      const li = h('li', null, h('span.num', { text: String(slot + 1) }), h('div.tx', null, t, d ? h('span.ds', { text: d }) : null));
      li.dataset.i = slot; li.dataset.mi = mi;
      if (S.locked[slot]) li.classList.add('locked');
      if (S.checked && (S.wrong || []).includes(slot)) li.classList.add('bad');
      return li;
    }));
    progress();
  }
  function flipDraw() {
    const before = new Map([...list.children].map(li => [li.dataset.mi, li.getBoundingClientRect().top]));
    draw();
    [...list.children].forEach((li, k) => {
      const b = before.get(li.dataset.mi);
      if (b == null) return;
      const d = b - li.getBoundingClientRect().top;
      if (Math.abs(d) < 1) return;
      li.animate([{ transform: `translateY(${d}px)` }, { transform: 'none' }], { duration: 640, delay: k * 16, easing: 'cubic-bezier(.34,1.25,.6,1)', fill: 'backwards' });
    });
  }
  function check() {
    if (S.checked) return advance();
    const wrong = [];
    S.order.forEach((mi, slot) => { if (!S.locked[slot]) { if (same(mi, slot)) S.locked[slot] = true; else wrong.push(slot); } });
    [...list.children].forEach((li, slot) => {
      if (wrong.includes(slot)) li.classList.add('bad');
      else if (!li.classList.contains('locked')) li.classList.add('good');
    });
    if (S.first == null) S.first = n - wrong.length;
    setOrb(null);
    if (!wrong.length) { buzz(12); saveSess(); progress(); setTimeout(() => complete(set, key, S.first / n, view), 700); return; }
    buzz([10, 40, 10]);
    S.order = M.map((_, i) => i); S.wrong = wrong; S.checked = true; saveSess();
    setTimeout(() => { if (!alive) return; flipDraw(); setOrb({ kind: 'next', tap: check }); }, 750);
  }
  function advance() {
    const slots = S.order.map((_, i) => i).filter(i => !S.locked[i]);
    const mixed = scramble(slots.map(i => S.order[i]));
    slots.forEach((slot, k) => (S.order[slot] = mixed[k]));
    S.checked = false; S.wrong = []; S.round++; saveSess();
    flipDraw(); kick($('#prog'), 'round');
    setOrb({ kind: 'check', tap: check });
  }
  let g = null;
  const begin = s => {
    g = sortable(list, s, s.target.closest('li'), {
      locked: i => !!S.locked[i],
      onDrop: (order, ch) => { if (ch) { S.order = order.map(i => S.order[i]); saveSess(); } draw(); }
    });
  };
  press(list, {
    filter: e => { const li = e.target.closest('li'); return !!li && !li.classList.contains('locked') && !S.checked; },
    hold: { ms: 170, fn: s => { if (!s.touch) return null; begin(s); return 'sort'; } },
    decide: s => { if (s.touch) return 'none'; begin(s); return 'sort'; },
    move: () => g && g.move(),
    end: () => { g && g.end(); g = null; }
  });
  const view = {
    el,
    orb: { kind: S.checked ? 'next' : 'check', tap: check },
    key(e) { if (e.key === 'Enter' && orb.dataset.kind !== 'hidden') { e.preventDefault(); check(); } },
    mounted: draw,
    destroy: () => { alive = false; }
  };
  return view;
}

/* ---------- 3. classify: fling the card into its bucket ---------- */
function studyClassify(set) {
  const src = set.cards.CLASSIFY.filter(c => str(c.card).trim() && str(c.group).trim());
  if (!src.length) return null;
  const D = diff, key = sk(set.id, 'CLASSIFY', D);
  const S = poolSession(key, src, c => c && typeof c === 'object' && 'group' in c);
  S.got = S.got && typeof S.got === 'object' ? S.got : {};
  const groups = [...new Set([...src, ...S.currentPool, ...S.unlearned].map(c => str(c.group)))];
  const rev = D === 'RE';
  const q = c => str(rev ? c.desc || c.card : c.card), a = c => str(rev ? c.card : c.desc);
  const canFlip = c => D !== 'MO' && !!a(c).trim() && a(c) !== q(c);
  const keyOf = c => JSON.stringify([c.card, c.group]);
  const C = cardEl();
  const stage = h('div.cstage', null, C.card);
  const bks = groups.map(gr => {
    const n = h('span.bn', { text: String(S.got[gr] || 0) });
    const b = h('button.bucket', { style: `--c:${colorOf(gr)}` }, h('span.bl', { text: gr }), n);
    b._g = gr; b._n = n;
    b.addEventListener('click', () => choose(b));
    return b;
  });
  const el = h('section', null, stage, h('div.buckets', null, bks));
  let busy = false, tx = 0, ty = 0, alive = true, over = null, rects = [];
  const bucketOf = gr => bks.find(b => b._g === gr);

  function paint(anim = true) {
    const c = S.currentPool[S.currentIndex];
    C.reset(); C.setFlip(false, true); C.setText(q(c), a(c));
    if (anim) enter(C.card);
    busy = false; tx = ty = 0;
    bks.forEach(b => b.classList.remove('hint', 'miss', 'over'));
    poolProgress(S);
  }
  function into(b, ok) {
    if (b) {
      const br = b.getBoundingClientRect(), cr = C.card.getBoundingClientRect();
      const dx = br.left + br.width / 2 - (cr.left + cr.width / 2) + tx;
      const dy = br.top + br.height / 2 - (cr.top + cr.height / 2) + ty;
      C.card.style.transition = 'transform .42s cubic-bezier(.5,0,.25,1), opacity .42s ease-in';
      C.card.style.transform = `translate(${dx}px,${dy}px) scale(.12)`;
      C.card.style.opacity = '0';
    }
    setTimeout(() => {
      if (ok && b) { S.got[b._g] = (S.got[b._g] || 0) + 1; b._n.textContent = String(S.got[b._g]); kick(b, 'hit'); }
      const res = poolAdvance(S, ok, keyOf);
      if (res === false) return complete(set, key, 1 - S.miss.length / S.total, view);
      saveSess();
      if (!alive) return;
      if (res === 'round') kick($('#prog'), 'round');
      paint();
    }, 420);
  }
  function choose(b) {
    if (busy || !b) return;
    busy = true;
    const c = S.currentPool[S.currentIndex];
    const target = bucketOf(str(c.group));
    if (b._g === str(c.group)) { buzz(8); into(target, true); return; }
    b.classList.add('miss'); kick(b, 'shake');
    if (target) target.classList.add('hint');
    C.mark('bad'); buzz([10, 40, 10]);
    C.card.style.transition = 'transform .5s var(--spring)'; C.card.style.transform = ''; tx = ty = 0;
    setTimeout(() => { if (alive) into(target, false); else { poolAdvance(S, false, keyOf); saveSess(); } }, 1100);
  }
  function tapCard() {
    if (busy) return;
    const c = S.currentPool[S.currentIndex];
    if (canFlip(c)) C.setFlip(!C.flipped); else kick(C.card, 'shake');
  }
  press(C.card, {
    decide: () => (busy ? 'none' : 'drag'),
    start: () => { C.card.style.transition = 'transform .08s linear'; rects = bks.map(b => [b, b.getBoundingClientRect()]); },
    move: s => {
      tx = s.dx; ty = s.dy;
      const hit = rects.find(([, r]) => s.x > r.left - 14 && s.x < r.right + 14 && s.y > r.top - 14 && s.y < r.bottom + 14);
      const nb = hit ? hit[0] : null;
      if (nb !== over) { if (over) over.classList.remove('over'); over = nb; if (over) { over.classList.add('over'); buzz(4); } }
      C.card.style.transform = `translate(${tx}px,${ty}px) rotate(${tx * .03}deg) scale(${over ? .7 : 1})`;
    },
    end: () => {
      const b = over;
      if (over) over.classList.remove('over');
      over = null;
      if (b) return choose(b);
      C.card.style.transition = 'transform .55s var(--spring)'; C.card.style.transform = ''; tx = ty = 0;
    },
    tap: tapCard
  });
  const view = {
    el, orb: null,
    key(e) {
      const d = parseInt(e.key, 10);
      if (d >= 1 && d <= bks.length) { e.preventDefault(); choose(bks[d - 1]); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tapCard(); }
    },
    mounted: () => paint(false),
    destroy: () => { alive = false; }
  };
  return view;
}

/* =========================================================
   boot
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const a = document.activeElement;
    if (a && a !== document.body && a.matches('input,textarea,[contenteditable]') && route.v !== 'study') { a.blur(); return; }
    e.preventDefault(); back(); return;
  }
  if (overlays.length || orb.classList.contains('open')) return;
  if (cur && cur.key) cur.key(e);
});
$('#back').append(ico('back'));
$('#xfer').append(ico('xfer'));
$('#back').addEventListener('click', back);
$('#xfer').addEventListener('click', openXfer);
$('#theme').addEventListener('click', cycleTheme);

load();
applyTheme(store.get(K.theme) || 'white');
depth = (history.state && history.state.d) || 0;
route = parse(location.hash);
history.replaceState({ d: depth }, '', hashOf(route));
show(route, 0);

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
